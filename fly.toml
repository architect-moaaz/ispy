# fly.toml app configuration file generated for ispy-server on 2026-10-29T01:05:05+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ispy-server'
primary_region = 'sin'

[build]
  dockerfile = 'server/Dockerfile'

[env]
  DEV_SIM = '1'
  ISPY_DB = '/data/ispy.db'
  LOG_LEVEL = 'info'
  PORT = '4000'
  TZ = 'Asia/Kolkata'

[[mounts]]
  source = 'ispy_data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/v1/world'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
